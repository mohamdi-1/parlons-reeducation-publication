name: Instagram
on:
  schedule:
    - cron: "35 17 * * *"
    - cron: "55 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python publish_ig.py
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: "v25.0"
          LEAD_MINUTES: "35"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
